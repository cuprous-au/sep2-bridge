name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: |
        cargo fmt -- --check
    - name: Lint and test (default features)
      run: |
        cargo clippy --tests --verbose -- -D warnings
        cargo test --workspace --verbose
    - name: Lint and test (map-imp-exp-site-limits feature)
      run: |
        cargo clippy --tests --verbose --features map-imp-exp-site-limits -- -D warnings
        cargo test --workspace --verbose --features map-imp-exp-site-limits
