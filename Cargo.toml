[workspace]
members = ["crates/sep2-bridge-service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-broadcast = "0.7.2"
axum = "0.8.8"
chrono = "0.4.38"
clap = "4.5.60"
derive_more = "2.1.1"
env_logger = "0.11.9"
exponential-backoff = "2.1.0"
git-version = "0.3.9"
log = "0.4.29"
num-traits = "0.2.19"
prometheus-client = "0.25.1"
rand = "0.10.2"
regex = "1.13.1"
reqwest = "0.12"
sep2_client = { git = "https://github.com/ethanndickson/sep2_client.git", rev = "2056996509072631a07fad3b6ada56a7676a2b87" }
sep2_common = "0.2.0"
serde = "1"
serde_json = "1"
sunspec = { version = "0.9.1", default-features = false }
tokio = "1.50.0"
tokio-modbus = "0.17.0"
tokio-util = "0.7.18"
tower-http = "0.6"
url = "2.5.8"
wiremock = "0.6.5"
proptest = "1.6.0"

[patch.crates-io]
sep2_common = { git = "https://github.com/ethanndickson/sep2_common.git", rev = "7f083fb1b2de43af614c50b57de0cfb6743017a6" }

[profile.release]
panic = "abort"